<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>人生の実績</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1efe8;--panel:#fff;--ink:#242421;--mute:#6f6d63;--line:#242421;--acc:#3f8f3a;--gold:#d9a521;--lock:#dcd9cd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1e1b;--panel:#2a2b27;--ink:#ecebe3;--mute:#a09e92;--line:#ecebe3;--acc:#67b85f;--gold:#f0bd3c;--lock:#3a3b36}}
:root[data-theme="dark"]{--bg:#1d1e1b;--panel:#2a2b27;--ink:#ecebe3;--mute:#a09e92;--line:#ecebe3;--acc:#67b85f;--gold:#f0bd3c;--lock:#3a3b36}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin:8px 0 14px}
.box{background:var(--panel);border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);padding:14px}
.score{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pts{font-size:40px;line-height:1;color:var(--gold);text-shadow:2px 2px 0 var(--line)}
.bar{flex:1;min-width:140px}
.track{height:14px;border:2px solid var(--line);background:var(--lock)}
.fill{height:100%;background:var(--acc);width:0;transition:width .5s}
.small{font-size:13px;color:var(--mute)}
h2{font-size:18px;margin:26px 0 10px}
form{display:grid;grid-template-columns:64px 1fr;gap:8px}
input,select,textarea,button{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);padding:8px;border-radius:0;min-width:0}
textarea{grid-column:1/3;resize:vertical;min-height:52px}
.row{grid-column:1/3;display:flex;gap:8px;flex-wrap:wrap}
.row select{flex:1}
button{cursor:pointer;background:var(--acc);color:#fff;border-color:var(--line);box-shadow:2px 2px 0 var(--line)}
button:active{transform:translate(2px,2px);box-shadow:none}
button.ghost{background:transparent;color:var(--mute);box-shadow:none;border-color:transparent;padding:4px 8px;font-size:13px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{background:var(--panel);color:var(--ink);flex:1}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ach{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center}
.ico{width:52px;height:52px;display:grid;place-items:center;font-size:28px;border:3px solid var(--line);background:var(--lock);filter:grayscale(1);opacity:.6}
.done .ico{filter:none;opacity:1;background:var(--gold)}
.name{font-size:17px}
.stars{color:var(--gold);letter-spacing:1px;text-shadow:1px 1px 0 var(--line)}
.acts{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.empty{text-align:center;color:var(--mute);padding:24px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.chip{padding:2px 10px;font-size:14px;background:var(--bg);color:var(--ink);box-shadow:none}
.chip[aria-pressed="true"]{background:var(--acc);color:#fff}
.tag{display:inline-block;font-size:12px;border:2px solid var(--line);padding:0 6px;margin:2px 4px 2px 0;background:var(--bg)}
.edit-row{grid-column:1/-1;display:grid;grid-template-columns:52px 1fr;gap:8px;padding-top:8px;margin-top:8px;border-top:2px dashed var(--line)}
.edit-row textarea{grid-column:1/3;min-height:44px}
.edit-row .row{grid-column:1/3}
#devbar{background:var(--gold);color:var(--line);border:2px solid var(--line);padding:6px 10px;font-size:13px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#toasts{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:grid;gap:8px;z-index:9;max-width:calc(100% - 24px)}
.toast{background:#242421;color:#fff;border:3px solid #ecebe3;padding:10px 14px;display:flex;gap:10px;align-items:center;animation:in .3s}
.toast b{display:block;color:#f0bd3c;font-weight:400;font-size:13px}
@keyframes in{from{transform:translateX(120%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.fill{transition:none}}
[hidden]{display:none!important}
.modes{display:grid;gap:14px;margin-top:16px}
.mode{display:grid;gap:4px;text-align:left;padding:18px;background:var(--panel);color:var(--ink);font-size:16px}
.mode:hover{background:var(--bg)}
.mode .mi{font-size:34px;line-height:1.2}.mode .mn{font-size:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
</style>
</head>
<body>
<main id="start">
<h1>人生の実績</h1>
<p class="small">モードを選んでスタート</p>
<div class="modes">
  <button type="button" class="mode box" id="m-custom"><span class="mi">✏️</span><span class="mn">自分で追加モード</span><span class="small">実績もタグも、自由に追加・削除できる</span><span class="small" id="pg-custom"></span></button>
  <button type="button" class="mode box" id="m-preset"><span class="mi">🏅</span><span class="mn">標準実績モード</span><span class="small">最初から入っている実績だけに挑戦する</span><span class="small" id="pg-preset"></span></button>
</div>
<p class="small">達成記録はモードごとに、このブラウザへ別々に保存されます。</p>
</main>
<main id="app" hidden>
<div class="top"><h1>人生の実績</h1><button type="button" id="back" class="ghost" style="border:2px solid var(--line)">モード選択へ</button></div>
<p class="small" style="margin-top:0">モード: <span id="modelabel"></span></p>
<div id="devbar">
  <span>🛠 開発モード: <span id="devstate">OFF</span>(バランス調整用の編集機能)</span>
  <button type="button" id="devtoggle" class="ghost" style="border:2px solid var(--line)">切り替え</button>
</div>
<section class="box score" aria-live="polite">
  <div><div class="pts" id="pts">0</div><div class="small">ポイント</div></div>
  <div class="bar"><div>レベル <span id="lv">1</span></div><div class="track"><div class="fill" id="fill"></div></div><div class="small" id="next"></div></div>
</section>

<div id="addsec">
<h2>実績を追加</h2>
<form class="box" id="f">
  <input id="emoji" value="🏆" maxlength="4" aria-label="絵文字" style="text-align:center;font-size:22px">
  <input id="title" placeholder="実績の名前" maxlength="40" required aria-label="実績の名前">
  <textarea id="desc" placeholder="達成条件や説明(任意)" maxlength="120"></textarea>
  <div style="grid-column:1/3">
    <div class="small">タグ(2つまで)</div>
    <div class="chips" id="fchips"></div>
    <div class="row"><input id="newtag" placeholder="新しいタグ" maxlength="8" aria-label="新しいタグ" style="flex:1"><button type="button" id="addtag">タグ追加</button></div>
  </div>
  <div class="row">
    <select id="diff" aria-label="難易度">
      <option value="1">難易度1(1pt)かんたん</option>
      <option value="2">難易度2(2pt)</option>
      <option value="3" selected>難易度3(3pt)</option>
      <option value="4">難易度4(4pt)</option>
      <option value="5">難易度5(5pt)むずかしい</option>
    </select>
    <button type="submit">追加</button>
  </div>
</form>
</div>

<h2>実績一覧</h2>
<div class="row" style="margin-bottom:10px">
  <input id="q" type="search" placeholder="実績を検索(名前・説明・タグ)" aria-label="実績を検索" style="flex:2;min-width:140px">
  <select id="tf" aria-label="タグで絞り込み" style="flex:1;min-width:110px"></select>
</div>
<div class="tabs" id="tabs">
  <button data-f="all" aria-pressed="true">すべて <span id="c-all"></span></button>
  <button data-f="todo" aria-pressed="false">未達成 <span id="c-todo"></span></button>
  <button data-f="done" aria-pressed="false">達成済み <span id="c-done"></span></button>
</div>
<ul id="list"></ul>
<h2>バックアップ・引っ越し</h2>
<section class="box">
  <p class="small" id="bkhint" style="margin-top:0"></p>
  <textarea id="bk" placeholder="ここに書き出し結果が出ます。読み込むときはここに貼り付け" style="width:100%;font-size:12px;min-height:90px"></textarea>
  <div class="row" style="margin-top:8px">
    <button type="button" id="ex">書き出す(コピー)</button>
    <button type="button" id="dl">ファイル保存</button>
    <button type="button" id="im">読み込む</button>
    <button type="button" id="imf">ファイルから読み込む</button>
    <input type="file" id="imfile" accept="application/json,.json" style="display:none">
  </div>
  <p class="small" id="msg" role="status" style="margin-bottom:0"></p>
</section>
<p class="small">データはこのブラウザに保存されます。</p>
</main>
<div id="toasts"></div>

function start(MODE){
const P=MODE==="preset";
const KEY=P?"life-achievements-preset-v1":"life-achievements-v1";
let items=[],filter="all";
try{items=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){items=[]}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}};
const stars=n=>"★".repeat(n)+"☆".repeat(5-n);
const BASE=["学校","生活","旅行","交流","運動","食","勉強"],TKEY=P?"life-achievements-preset-tags-v1":"life-achievements-tags-v1";
let custom=[],sel=[],editing=null,editingFull=null,devMode=false;
try{custom=JSON.parse(localStorage.getItem(TKEY)||"[]")}catch(e){custom=[]}
if(!Array.isArray(custom))custom=[];
const allTags=()=>BASE.concat(custom);
const saveTags=()=>{try{localStorage.setItem(TKEY,JSON.stringify(custom))}catch(e){}};
function addCustom(t){t=String(t).trim().slice(0,8);if(t&&!allTags().includes(t)){custom.push(t);saveTags()}return t}
items.forEach((a,i)=>{if(!Array.isArray(a.tags))a.tags=[];a.tags.forEach(addCustom);if(typeof a.order!=="number")a.order=i});
if(P){items=items.filter(x=>PRESET.some(p=>p.id===x.id));PRESET.forEach((p,i)=>{if(!items.some(x=>x.id===p.id))items.push({id:p.id,emoji:p.emoji,title:p.title,desc:p.desc,diff:p.diff,created:0,doneAt:null,tags:p.tags.slice(0,2),order:i})});save()}
const note=t=>{const n=document.createElement("div");n.className="toast";n.textContent=t;$("toasts").appendChild(n);setTimeout(()=>n.remove(),2500)};
function toggle(arr,t){const i=arr.indexOf(t);if(i>=0)arr.splice(i,1);else if(arr.length<2)arr.push(t);else note("タグは2つまでです")}
const chips=(cur,attr)=>allTags().map(t=>`<button type="button" class="chip" ${attr} data-t="${esc(t)}" aria-pressed="${cur.includes(t)}">${esc(t)}</button>`).join("");
const renderForm=()=>{$("fchips").innerHTML=chips(sel,"")};
const fmt=t=>{const d=new Date(t),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function toast(a){
  const t=document.createElement("div");t.className="toast";
  t.innerHTML=`<span style="font-size:26px">${esc(a.emoji)}</span><div><b>実績解除!</b>${esc(a.title)} +${a.diff}pt</div>`;
  $("toasts").appendChild(t);setTimeout(()=>t.remove(),4000);
}
function render(){
  const total=items.filter(a=>a.doneAt).reduce((s,a)=>s+a.diff,0);
  const lv=Math.floor(total/10)+1;
  $("pts").textContent=total;$("lv").textContent=lv;
  $("fill").style.width=(total%10)*10+"%";
  $("next").textContent=`次のレベルまであと${10-total%10}pt(${items.filter(a=>a.doneAt).length}/${items.length}件達成)`;
  const q=$("q").value.trim().toLowerCase();
  const tfEl=$("tf"),cur=tfEl.value;
  tfEl.innerHTML='<option value="">すべてのタグ</option>'+allTags().map(t=>`<option>${esc(t)}</option>`).join("");
  tfEl.value=allTags().includes(cur)?cur:"";
  const tf=tfEl.value;
  const doneN=items.filter(a=>a.doneAt).length;
  $("c-all").textContent=`(${items.length})`;
  $("c-todo").textContent=`(${items.length-doneN})`;
  $("c-done").textContent=`(${doneN})`;
  const view=items.filter(a=>filter==="all"||(filter==="done")===!!a.doneAt)
    .filter(a=>!tf||a.tags.includes(tf))
    .filter(a=>!q||(a.title+" "+a.desc+" "+a.tags.join(" ")).toLowerCase().includes(q))
    .sort(devMode?(a,b)=>a.order-b.order:(a,b)=>(!!a.doneAt-!!b.doneAt)||(a.doneAt?b.doneAt-a.doneAt:P?a.order-b.order:b.created-a.created));
  $("list").innerHTML=view.length?view.map(a=>`
    <li class="box ach ${a.doneAt?"done":""}" ${devMode?`draggable="true" data-drag="${a.id}"`:""}>
      ${devMode?`<span class="small" style="grid-column:1/-1;cursor:grab">↕ ドラッグで並び替え</span>`:""}
      <div class="ico">${esc(a.emoji)}</div>
      <div><div class="name">${esc(a.title)}</div>
        ${editing===a.id?`<div class="chips">${chips(a.tags,'data-e="1"')}</div>`:a.tags.length?`<div>${a.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`:""}
        ${a.desc?`<div class="small">${esc(a.desc)}</div>`:""}
        <div><span class="stars">${stars(a.diff)}</span> <span class="small">${a.diff}pt${a.doneAt?" ・ "+fmt(a.doneAt):""}</span></div></div>
      <div class="acts">
        ${a.doneAt?`<button class="ghost" data-a="undo" data-id="${a.id}">取り消す</button>`:`<button data-a="done" data-id="${a.id}">達成!</button>`}
        <button class="ghost" data-a="tag" data-id="${a.id}">${editing===a.id?"タグ完了":"タグ変更"}</button>
        ${devMode?`<button class="ghost" data-a="editfull" data-id="${a.id}">${editingFull===a.id?"編集を閉じる":"編集"}</button>`:""}
        ${P?"":`<button class="ghost" data-a="del" data-id="${a.id}">削除</button>`}
      </div>
      ${devMode&&editingFull===a.id?`
      <div class="edit-row">
        <input data-ef="emoji" data-id="${a.id}" value="${esc(a.emoji)}" maxlength="4" aria-label="絵文字" style="text-align:center;font-size:20px">
        <input data-ef="title" data-id="${a.id}" value="${esc(a.title)}" maxlength="40" aria-label="実績の名前">
        <textarea data-ef="desc" data-id="${a.id}" maxlength="120" aria-label="説明">${esc(a.desc)}</textarea>
        <div class="row">
          <select data-ef="diff" data-id="${a.id}" aria-label="難易度">
            ${[1,2,3,4,5].map(n=>`<option value="${n}" ${a.diff===n?"selected":""}>難易度${n}(${n}pt)</option>`).join("")}
          </select>
          <button type="button" class="ghost" data-a="savefull" data-id="${a.id}" style="border:2px solid var(--line)">保存</button>
        </div>
      </div>`:""}
      </li>`).join(""):`<li class="empty">${items.length?"該当する実績はありません":(P?"標準実績はまだ登録されていません。":"まだ実績がありません。上のフォームから最初の1つを追加しよう。")}</li>`;
}
$("f").onsubmit=e=>{
  e.preventDefault();
  items.push({id:Date.now().toString(36),emoji:$("emoji").value.trim()||"🏆",title:$("title").value.trim(),desc:$("desc").value.trim(),diff:+$("diff").value,created:Date.now(),doneAt:null,tags:sel.slice(),order:items.length});
  save();e.target.reset();$("emoji").value="🏆";$("diff").value="3";sel=[];renderForm();render();
};
$("list").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.t){const c=items.find(x=>x.id===editing);if(c){toggle(c.tags,b.dataset.t);save();render()}return}
  const a=items.find(x=>x.id===b.dataset.id);if(!a)return;
  if(b.dataset.a==="done"){a.doneAt=Date.now();toast(a)}
  else if(b.dataset.a==="undo"){a.doneAt=null}
  else if(b.dataset.a==="tag"){editing=editing===a.id?null:a.id}
  else if(b.dataset.a==="editfull"){editingFull=editingFull===a.id?null:a.id;render();return}
  else if(b.dataset.a==="savefull"){
    const box=b.closest("li");
    a.emoji=box.querySelector('[data-ef="emoji"]').value.trim()||"🏆";
    a.title=box.querySelector('[data-ef="title"]').value.trim()||a.title;
    a.desc=box.querySelector('[data-ef="desc"]').value.trim();
    a.diff=Math.min(5,Math.max(1,+box.querySelector('[data-ef="diff"]').value||3));
    editingFull=null;save();render();return;
  }
  else if(confirm(`「${a.title}」を削除しますか?`)){items=items.filter(x=>x!==a)}
  save();render();
};
$("tabs").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  filter=b.dataset.f;
  document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  render();
};
const say=t=>$("msg").textContent=t;
$("ex").onclick=async()=>{
  $("bk").value=JSON.stringify({app:"life-achievements",items,customTags:custom},null,1);
  try{await navigator.clipboard.writeText($("bk").value);say("コピーしました。("+items.length+"件)")}
  catch(e){$("bk").select();say("枠内のテキストを全選択してコピーしてください。")}
};
$("dl").onclick=()=>{
  try{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify({app:"life-achievements",items,customTags:custom},null,1)],{type:"application/json"}));
    a.download=P?"life-achievements-progress.json":"life-achievements.json";a.click();say("保存しました。動かない場合は「書き出す」を使ってください。");
  }catch(e){say("保存できませんでした。「書き出す」を使ってください。")}
};
function importFrom(text){
  try{
    const d=JSON.parse(text);
    const src=Array.isArray(d)?d:d.items;
    if(!Array.isArray(src))throw 0;
    if(P){let n=0;src.forEach(a=>{if(!a||!a.doneAt)return;const t=items.find(x=>x.id===a.id);if(!t||t.doneAt)return;t.doneAt=+a.doneAt;n++});save();render();say(n+"件の達成記録を読み込みました。(すでに達成済みのものは変更しません)");return}
    if(Array.isArray(d.customTags))d.customTags.forEach(t=>typeof t==="string"&&addCustom(t));
    let n=0;
    src.forEach(a=>{
      if(!a||typeof a.title!=="string"||items.some(x=>x.id===a.id))return;
      const tg=(Array.isArray(a.tags)?a.tags:[]).filter(t=>typeof t==="string"&&t.trim()).map(addCustom).filter(Boolean).slice(0,2);
      items.push({id:String(a.id||Date.now().toString(36)+n),emoji:String(a.emoji||"🏆"),title:a.title,desc:String(a.desc||""),diff:Math.min(5,Math.max(1,+a.diff||3)),created:+a.created||Date.now(),doneAt:a.doneAt?+a.doneAt:null,tags:tg,order:items.length});n++;
    });
    save();renderForm();render();say(n+"件を追加しました。(同じ実績は重複しません)");
  }catch(e){say("読み込めませんでした。書き出したテキストやファイルの内容を確認してください。")}
}
$("im").onclick=()=>importFrom($("bk").value);
$("imf").onclick=()=>$("imfile").click();
$("imfile").onchange=()=>{
  const f=$("imfile").files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{$("bk").value=r.result;importFrom(r.result)};
  r.onerror=()=>say("ファイルを読み込めませんでした。");
  r.readAsText(f);
  $("imfile").value="";
};
$("q").oninput=render;
$("tf").onchange=render;
$("fchips").onclick=e=>{const b=e.target.closest("button");if(!b)return;toggle(sel,b.dataset.t);renderForm()};
$("addtag").onclick=()=>{
  const t=addCustom($("newtag").value);$("newtag").value="";
  if(t&&!sel.includes(t)&&sel.length<2)sel.push(t);
  renderForm();render();
};
$("newtag").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("addtag").click()}};
let dragId=null;
$("list").ondragstart=e=>{
  const li=e.target.closest("li[data-drag]");if(!li)return;
  dragId=li.dataset.drag;e.dataTransfer.effectAllowed="move";li.style.opacity=".4";
};
$("list").ondragend=e=>{
  const li=e.target.closest("li[data-drag]");if(li)li.style.opacity="";
};
$("list").ondragover=e=>{
  if(!devMode||!dragId)return;e.preventDefault();e.dataTransfer.dropEffect="move";
};
$("list").ondrop=e=>{
  if(!devMode||!dragId)return;e.preventDefault();
  const li=e.target.closest("li[data-drag]");if(!li||li.dataset.drag===dragId){dragId=null;return}
  const dragged=items.find(x=>x.id===dragId),target=items.find(x=>x.id===li.dataset.drag);
  if(!dragged||!target){dragId=null;return}
  const ordered=items.slice().sort((a,b)=>a.order-b.order);
  const from=ordered.indexOf(dragged),to=ordered.indexOf(target);
  ordered.splice(from,1);ordered.splice(to,0,dragged);
  ordered.forEach((a,i)=>a.order=i);
  dragId=null;save();render();
};
$("devtoggle").onclick=()=>{
  devMode=!devMode;editingFull=null;
  $("devstate").textContent=devMode?"ON":"OFF";
  render();
};
renderForm();
$("addsec").hidden=P;
$("modelabel").textContent=P?"標準実績モード":"自分で追加モード";
$("bkhint").textContent=P?"書き出したテキストやファイルを別の端末で読み込めば、達成記録を引き継げます。":"書き出したテキストを別の端末の「読み込む」に貼り付ければ、実績を引き継げます。";
$("devstate").textContent="OFF";$("q").value="";$("bk").value="";$("msg").textContent="";
document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.f==="all"));
$("back").onclick=showStart;
render();
}
const G=id=>document.getElementById(id);
function prog(k,f){try{let a=JSON.parse(localStorage.getItem(k)||"[]");if(f&&Array.isArray(a))a=a.filter(f);return Array.isArray(a)&&a.length?a.filter(x=>x.doneAt).length+"/"+a.length+"件達成":"まだ記録なし"}catch(e){return "まだ記録なし"}}
function showStart(){
  G("app").hidden=true;G("start").hidden=false;
  G("pg-custom").textContent=prog("life-achievements-v1");
  G("pg-preset").textContent=prog("life-achievements-preset-v1",x=>PRESET.some(p=>p.id===x.id));
  window.scrollTo(0,0);
}
[["m-custom","custom"],["m-preset","preset"]].forEach(([id,m])=>G(id).onclick=()=>{G("start").hidden=true;G("app").hidden=false;start(m);window.scrollTo(0,0)});
showStart();
</script>
</body>
</html>
